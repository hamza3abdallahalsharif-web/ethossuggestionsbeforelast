<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ethos International School — Student Council Suggestions</title>
<link rel="icon" href="hamza.png">
<style>
:root{
  --purple:#8338ec;--pink:#ff4fa3;--teal:#19d3c5;--blue:#3a86ff;--green:#2fd66b;--yellow:#ffd23f;
  --ink:#241a3d;--ink-soft:#6d6485;--card:#ffffff;--card-2:#f3effc;--bg1:#8338ec;--bg2:#ff4fa3;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,var(--blue));background-attachment:fixed;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.hero{text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);margin:10px 0 18px}
.logo-c{width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid var(--yellow);box-shadow:0 6px 0 rgba(0,0,0,.18);overflow:hidden;margin:0 auto 8px}
.logo-c img{width:100%;height:100%;object-fit:contain;display:block}
.hero h1{margin:2px 0;font-size:clamp(1.3rem,4.4vw,1.9rem)}
.hero p{margin:0;opacity:.95;font-size:1rem}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 30px rgba(0,0,0,.18);margin-bottom:14px;animation:pop .15s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.btn{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:14px;padding:11px 20px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .07s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.green{background:linear-gradient(135deg,var(--teal),var(--green))}
.btn.red{background:linear-gradient(135deg,#ff4f5a,#ff7b2f)}
.btn.ghost{background:var(--card-2);color:var(--ink);box-shadow:none;border:2px solid #e2dbf5}
.btn.sm{font-size:.85rem;padding:7px 14px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.xs{font-size:.76rem;padding:5px 10px;border-radius:9px;box-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn.pill-white{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.55)}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;margin-top:6px}
.ybtn{border:0;font:inherit;color:#fff;border-radius:18px;padding:16px 6px;cursor:pointer;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .07s;text-align:center}
.ybtn b{display:block;font-size:1.9rem;line-height:1}
.ybtn:active{transform:translateY(3px)}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.namebtn{border:0;font:inherit;background:var(--card-2);color:var(--ink);border-radius:16px;padding:14px 10px;cursor:pointer;font-weight:600;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.1);transition:transform .07s}
.namebtn:active{transform:translateY(3px)}
.classgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:6px}
.classbtn{border:0;font:inherit;color:#fff;border-radius:16px;padding:14px 6px;cursor:pointer;font-weight:700;font-size:1.05rem;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .07s;text-align:center}
.classbtn:active{transform:translateY(3px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.tab{font:inherit;font-weight:700;font-size:.92rem;border:0;border-radius:13px;padding:8px 14px;cursor:pointer;background:rgba(255,255,255,.22);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.55)}
.tab.on{background:#fff;color:var(--purple);border-color:#fff}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:18px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.whoami{color:#fff;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{background:var(--card-2);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:.94rem;color:var(--ink-soft);text-align:center}
.sugg{border-bottom:1px solid #ece6f7;padding:12px 0}
.sugg:last-child{border-bottom:0}
.sugg .txt{font-size:1.05rem;line-height:1.35;margin-bottom:8px}
.meta{font-size:.78rem;color:var(--ink-soft);margin-bottom:8px}
.attrib{font-size:.78rem;color:var(--purple);background:#f3effc;border-radius:10px;padding:6px 10px;margin:6px 0;display:inline-block;font-weight:600}
.meter{display:flex;height:10px;border-radius:8px;overflow:hidden;background:#ece6f7;margin-bottom:8px}
.meter .a{background:linear-gradient(90deg,var(--teal),var(--green))}
.meter .d{background:linear-gradient(90deg,#ff7b2f,#ff4f5a)}
.counts{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft);margin-bottom:8px}
.votebtns{display:flex;gap:8px}
.votebtn{flex:1;font:inherit;font-weight:700;border-radius:13px;padding:9px 6px;cursor:pointer;border:2px solid #e2dbf5;background:#fff;color:var(--ink);transition:transform .07s}
.votebtn:active{transform:translateY(2px)}
.votebtn.agree.on{background:linear-gradient(135deg,var(--teal),var(--green));color:#fff;border-color:transparent}
.votebtn.disagree.on{background:linear-gradient(135deg,#ff7b2f,#ff4f5a);color:#fff;border-color:transparent}
.notewrap{margin-top:8px}
.notewrap textarea,.ta{width:100%;font:inherit;font-size:.92rem;border:2px solid #e2dbf5;border-radius:14px;padding:10px 12px;resize:vertical;min-height:44px;background:var(--card-2);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.05);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:8px;padding:2px 8px;margin-left:6px}
.badge.pending{background:#ffe9cf;color:#8a4700}
.badge.approved{background:#d9fbe6;color:#0b6b32}
.badge.rejected{background:#ffe0e0;color:#8a1f1f}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:1.05rem;border:2px solid #e2dbf5;border-radius:16px;padding:12px 16px;background:var(--card-2);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.05);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease,transform .12s ease}
input[type=text]::placeholder,input[type=password]::placeholder,.ta::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.75}
input[type=text]:focus,input[type=password]:focus,.ta:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(131,56,236,.18),0 2px 0 rgba(0,0,0,.05);background:var(--card)}
input[type=text]:focus{transform:translateY(-1px)}
.topbar input[type=text]{background:rgba(255,255,255,.14);border:2px solid transparent;color:#fff;box-shadow:none;border-radius:14px;padding:10px 14px}
.topbar input[type=text]::placeholder{color:rgba(255,255,255,.8)}
.topbar input[type=text]:focus{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.7);box-shadow:0 0 0 4px rgba(255,255,255,.15);transform:none}
.ov{position:fixed;inset:0;background:rgba(20,8,60,.6);backdrop-filter:blur(3px);z-index:150;display:grid;place-items:center;padding:16px}
.pop-box{background:#fff;color:var(--ink);border-radius:24px;padding:22px;max-width:420px;width:100%;box-shadow:0 12px 0 rgba(0,0,0,.2),0 26px 50px rgba(0,0,0,.4);max-height:88vh;overflow:auto}
.pop-box h3{margin:0 0 8px;font-size:1.25rem;text-align:center}
.pop-box p{margin:0 0 12px;color:var(--ink-soft);text-align:center;font-size:.96rem}
.spin{text-align:center;color:#fff;padding:40px 0}
.foot{text-align:center;margin-top:20px}
.adminrow{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #ece6f7;padding:10px 0}
.adminrow:last-child{border-bottom:0}
.adminrow .txt{flex:1;min-width:0}
.adminrow .btns{display:flex;gap:6px;flex-wrap:wrap}
.chatwrap{display:flex;flex-direction:column;height:52vh;min-height:320px}
.chatlist{flex:1;overflow-y:auto;padding:4px 2px}
.msgrow{display:flex;gap:8px;align-items:flex-end;margin:8px 0}
.msgrow.me{justify-content:flex-end}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;background:var(--card-2);font-size:.94rem;line-height:1.3}
.bubble.me{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.bubble .who{font-size:.72rem;font-weight:700;opacity:.8;margin-bottom:2px}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1}
.dmrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ece6f7;cursor:pointer}
.dmrow:last-child{border-bottom:0}
.dmrow:hover{background:var(--card-2);border-radius:12px}
.dmrow-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.dmrow-txt b{font-size:.95rem}
.dmrow-txt small{color:var(--ink-soft);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmrow-time{font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.yearblock{border:2px solid #ece6f7;border-radius:18px;padding:12px;margin-bottom:12px}
.yearblock h4{margin:0 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.classblock{background:var(--card-2);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.classblock .chead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-weight:700}
.studchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e2dbf5;border-radius:20px;padding:4px 6px 4px 12px;margin:3px 4px 3px 0;font-size:.85rem}
.studchip button{border:0;background:#ff4f5a;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;line-height:1}
.danger-box{border:2px dashed #ff4f5a;border-radius:18px;padding:14px;margin-top:16px;text-align:center}
.danger-box h4{margin:0 0 6px;color:#ff4f5a}

/* ===== Dark theme ===== */
:root[data-theme="dark"]{--ink:#f1edff;--ink-soft:#b6accf;--card:#241a3d;--card-2:#332a52;--bg1:#160f28;--bg2:#3a1e52}
:root[data-theme="dark"] body{background:linear-gradient(135deg,var(--bg1),var(--bg2) 60%,#101226)}
:root[data-theme="dark"] .pop-box{background:var(--card);color:var(--ink)}
:root[data-theme="dark"] input[type=text],:root[data-theme="dark"] .ta,:root[data-theme="dark"] textarea,:root[data-theme="dark"] input[type=password]{background:#1b1430;color:var(--ink);border-color:#4a3d70}
:root[data-theme="dark"] input[type=text]:focus,:root[data-theme="dark"] input[type=password]:focus,:root[data-theme="dark"] .ta:focus,:root[data-theme="dark"] textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,79,163,.22),0 2px 0 rgba(0,0,0,.1);background:#241a3d}
:root[data-theme="dark"] .votebtn{background:#1b1430;border-color:#4a3d70;color:var(--ink)}
:root[data-theme="dark"] .btn.ghost{background:#1b1430;border-color:#4a3d70;color:var(--ink)}
:root[data-theme="dark"] .studchip{background:#1b1430;border-color:#4a3d70;color:var(--ink)}
:root[data-theme="dark"] .namebtn{background:var(--card-2);color:var(--ink)}
:root[data-theme="dark"] .yearblock,:root[data-theme="dark"] .sugg,:root[data-theme="dark"] .adminrow{border-color:#3a2f5c}
:root[data-theme="dark"] .attrib{background:#332a52}
:root[data-theme="dark"] .meter{background:#3a2f5c}

/* ===== RTL (Arabic) ===== */
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
html[dir="rtl"] .whoami,html[dir="rtl"] .row,html[dir="rtl"] .tabs{direction:rtl}
html[dir="rtl"] .msgrow.me{justify-content:flex-start}
html[dir="rtl"] .msgrow:not(.me){justify-content:flex-end}
html[dir="rtl"] .bubble{text-align:right}
html[dir="rtl"] .dmrow,html[dir="rtl"] .adminrow{direction:rtl}
html[dir="rtl"] .attrib,html[dir="rtl"] .meta{direction:rtl}

/* ===== Settings screen ===== */
.settingsrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px;border-bottom:1px solid #ece6f7;flex-wrap:wrap}
.settingsrow:last-child{border-bottom:0}
.settingsrow .lbl{font-weight:700}
.settingsrow .sub{font-size:.8rem;color:var(--ink-soft);font-weight:500;margin-top:2px}
.seg{display:flex;border-radius:12px;overflow:hidden;border:2px solid #e2dbf5}
.seg button{font:inherit;font-weight:700;border:0;background:var(--card-2);color:var(--ink);padding:8px 14px;cursor:pointer;font-size:.88rem}
.seg button.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.avatar-big{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:0 auto 10px;box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative;cursor:pointer;background:var(--card-2)}
.avatar-big img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-big .cam{position:absolute;right:-2px;bottom:-2px;background:var(--purple);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.85rem;border:2px solid #fff}

/* ===== Chat composer extras ===== */
.composer-wrap{margin-top:10px}
.preview-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.preview-chip{position:relative}
.preview-chip img{width:56px;height:56px;object-fit:cover;border-radius:10px;display:block}
.preview-chip button{position:absolute;top:-6px;right:-6px;border:0;background:#ff4f5a;color:#fff;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;line-height:1}
.chatform{position:relative}
.iconbtn{border:0;background:var(--card-2);color:var(--ink);border-radius:12px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(2px)}
.emoji-pop{position:absolute;bottom:48px;left:0;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;z-index:30;max-width:260px}
:root[data-theme="dark"] .emoji-pop{background:var(--card)}
.emoji-pop button{border:0;background:transparent;font-size:1.25rem;padding:4px;cursor:pointer;border-radius:8px}
.emoji-pop button:hover{background:var(--card-2)}
.msg-img{max-width:200px;max-height:200px;border-radius:12px;margin-top:6px;display:block;object-fit:cover;cursor:pointer}
.bubble a{color:inherit;text-decoration:underline;word-break:break-all}
.chatlist-item.group{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.chatlist-item.group b,.chatlist-item.group small{color:#fff}
.section-lbl{font-size:.78rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:12px 4px 4px}
.imgview-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;display:grid;place-items:center;padding:20px}
.imgview-ov img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   SETTINGS — this is the ONLY thing that ties the site to your backend.
   Keep this exactly equal to the "Web app URL" from Apps Script > Deploy.
   ===================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwm-ewKJ4_lz-JX6qgJ-v58qyXb9YvuZ0Eo1sP2qrPjRn1bUFUtoErNP1OZh5ElNqu/exec";
const HEAD_PASSWORD_LOCAL = "Eis@Ethos@123"; // only used as a fallback if the server can't be reached

/* =====================================================================
   SERVER — talks to the Apps Script backend
   ===================================================================== */
let serverMode=false;
let lastServerError="";
async function api(action,body){
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(APPS_SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({...(body||{}),action}),
      redirect:"follow",
      cache:"no-store",
      signal:ctl.signal
    });
    const t=await r.text();
    return JSON.parse(t);
  }catch(e){
    lastServerError=String((e&&e.message)||e);
    throw e;
  }finally{clearTimeout(to)}
}
async function detectServer(){
  try{
    const j=await api("ping");
    serverMode=!!(j&&j.ok&&j.app==="ethos-suggestions");
  }catch(e){serverMode=false}
}

/* =====================================================================
   ROSTER — always pulled fresh from the backend, so admin changes made on
   ANY device (add/remove a year, class or student) show up on every device.
   ===================================================================== */
let ROSTER={years:[],classesByYear:{},studentsByYearCls:{}};
let backendOutdated=false;
async function loadRoster(){
  try{
    const j=await api("roster_get");
    if(j&&j.ok){ROSTER={years:j.years||[],classesByYear:j.classesByYear||{},studentsByYearCls:j.studentsByYearCls||{}};backendOutdated=false;}
    else if(j&&j.error==="unknown_action"){backendOutdated=true;}
  }catch(e){}
}
function classesFor(year){return ROSTER.classesByYear[year]||[]}
function studentsFor(year,cls){return ROSTER.studentsByYearCls[year+"|"+cls]||[]}
function allStudentsFlat(){
  const out=[];
  for(const k in ROSTER.studentsByYearCls){
    const [y,c]=k.split("|");
    ROSTER.studentsByYearCls[k].forEach(s=>out.push({id:s.id,name:s.name,year:y,cls:c}));
  }
  return out;
}
function findStudentInRoster(id){
  for(const k in ROSTER.studentsByYearCls)for(const p of ROSTER.studentsByYearCls[k])if(p.id===id)return p;
  return null;
}
function outdatedBackendNote(){
  return backendOutdated?`<div class="note" style="background:#ffe0e0;color:#8a1f1f;font-weight:700">⚠️ Your Google Apps Script backend is out of date (it doesn't recognise the newer roster/chat features yet). Open your Apps Script project, replace ALL of Code.gs with the latest version, then Deploy → Manage deployments → pencil → New version → Deploy. This page can't load year groups/classes/students or chat until that's done.</div>`:"";
}

/* =====================================================================
   AVATARS — small colour-coded initials bubble, used in Chat &amp; Private messages
   ===================================================================== */
function initials(name){const w=(name||"?").trim().split(/\s+/);return (w[0]?.[0]||"?").toUpperCase()+(w[1]?.[0]||"").toUpperCase()}
function avatarColor(name){
  const cols=["#8338ec","#ff4fa3","#3a86ff","#19d3c5","#2fd66b","#ff7b2f","#e63946","#6a4c93"];
  let h=0;for(let i=0;i<(name||"").length;i++)h=(h*31+name.charCodeAt(i))>>>0;
  return cols[h%cols.length];
}
function avatarHTML(name,size,id,imgOverride){
  size=size||34;
  const img=imgOverride||(id?getAvatar(id):"");
  if(img)return `<div style="width:${size}px;height:${size}px;min-width:${size}px;border-radius:50%;overflow:hidden"><img src="${img}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`;
  return `<div style="width:${size}px;height:${size}px;min-width:${size}px;border-radius:50%;background:${avatarColor(name||"?")};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round(size*0.4)}px">${escapeHtml(initials(name))}</div>`;
}

/* =====================================================================
   IDENTITY (stored on this device so students don't re-pick every visit)
   ===================================================================== */
const K_ME="ethos_sugg_me_v1";
function getMe(){try{return JSON.parse(localStorage.getItem(K_ME))}catch(e){return null}}
function setMe(p){try{localStorage.setItem(K_ME,JSON.stringify(p))}catch(e){}}
function clearMe(){try{localStorage.removeItem(K_ME)}catch(e){}}
let ME=getMe();
let adminPass=null;
let chatPoll=null;

/* =====================================================================
   SETTINGS: theme, language, avatar, password (stored per-device; best
   effort sync to backend if it supports the newer actions below)
   ===================================================================== */
const K_THEME="ethos_theme_v1", K_LANG="ethos_lang_v1", K_AVATAR="ethos_avatar_v1_", K_PASS="ethos_pw_v1_";
function getTheme(){return localStorage.getItem(K_THEME)||"light"}
function setTheme(v){try{localStorage.setItem(K_THEME,v)}catch(e){}applyTheme()}
function applyTheme(){document.documentElement.setAttribute("data-theme",getTheme())}
function getLang(){return localStorage.getItem(K_LANG)||"en"}
function setLang(v){try{localStorage.setItem(K_LANG,v)}catch(e){}applyLang()}
function applyLang(){const l=getLang();document.documentElement.setAttribute("lang",l);document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr")}
function getAvatar(id){try{return localStorage.getItem(K_AVATAR+id)||""}catch(e){return""}}
function setAvatarLocal(id,dataUrl){try{localStorage.setItem(K_AVATAR+id,dataUrl)}catch(e){}}
function defaultPasswordFor(name){const first=(name||"").trim().split(/\s+/)[0]||"";return first+"@123"}

/* =====================================================================
   PASSWORD — checked against the backend when it supports it, otherwise
   falls back to a per-device password so the app still works.
   ===================================================================== */
async function verifyPassword(id,pass,name){
  try{
    const j=await api("student_verify_password",{studentKey:id,password:pass});
    if(j&&j.ok)return !!j.valid;
    if(!(j&&j.error==="unknown_action"))return false;
  }catch(e){}
  return pass===getLocalPassword(id,name);
}
async function changePassword(id,oldPass,newPass,name){
  const ok=await verifyPassword(id,oldPass,name);
  if(!ok)return{ok:false,error:"wrong_old"};
  try{
    const j=await api("student_set_password",{studentKey:id,oldPassword:oldPass,newPassword:newPass});
    if(j&&j.ok){setLocalPassword(id,newPass);return{ok:true}}
  }catch(e){}
  setLocalPassword(id,newPass);
  return{ok:true,localOnly:true};
}

/* =====================================================================
   LINKIFY / EMOJI — used when rendering chat & DM message bubbles
   ===================================================================== */
function linkify(escapedText){
  return escapedText.replace(/((https?:\/\/|www\.)[^\s<]+)/gi,(m)=>{
    const href=m.startsWith("http")?m:"https://"+m;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${m}</a>`;
  });
}
const EMOJI_SET=["😀","😂","😍","😎","🤩","😢","😡","👍","👎","🙏","🎉","🔥","💯","❤️","👏","😴","🤔","😭","🥳","😱","🙌","💪","✨","👋","🤝","📚","⚽","🎮","🍕","☕"];
function wireEmojiButton(btn,inputEl){
  btn.onclick=(e)=>{
    e.stopPropagation();
    const existing=document.querySelector(".emoji-pop");
    if(existing){existing.remove();if(existing.dataset.for===btn.id)return}
    const pop=document.createElement("div");pop.className="emoji-pop";pop.dataset.for=btn.id;
    pop.innerHTML=EMOJI_SET.map(em=>`<button type="button">${em}</button>`).join("");
    btn.parentElement.style.position="relative";
    btn.parentElement.appendChild(pop);
    pop.querySelectorAll("button").forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();inputEl.value+=b.textContent;inputEl.focus();});
    const closeOnce=(ev)=>{if(!pop.contains(ev.target)&&ev.target!==btn){pop.remove();document.removeEventListener("click",closeOnce)}};
    setTimeout(()=>document.addEventListener("click",closeOnce),10);
  };
}
function resizeImageFile(file,maxDim,cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
      else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function wireImageButton(btn,onPicked){
  const input=document.createElement("input");input.type="file";input.accept="image/*";input.style.display="none";
  document.body.appendChild(input);
  btn.onclick=()=>input.click();
  input.onchange=()=>{
    const f=input.files&&input.files[0];if(!f)return;
    resizeImageFile(f,640,(dataUrl)=>onPicked(dataUrl));
    input.value="";
  };
}
function viewImageFull(src){
  const ov=document.createElement("div");ov.className="imgview-ov";
  ov.innerHTML=`<img src="${src}">`;
  ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
}

function popup({title="",text="",input=null,inputVal="",buttons=[{label:"OK",cls:""}]}){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="pop-box"><h3>${title}</h3>${text?`<p>${text}</p>`:""}${input==="textarea"?`<textarea id="popIn" class="ta" rows="4" placeholder="Type here…">${inputVal}</textarea>`:input?`<input id="popIn" type="${input}" value="${inputVal}">`:""}<div class="row" style="margin-top:14px"></div></div>`;
  const row=ov.querySelector(".row");
  buttons.forEach(b=>{
    const el=document.createElement("button");el.className="btn "+(b.cls||"");el.textContent=b.label;
    el.onclick=()=>{const v=input?ov.querySelector("#popIn").value:null;if(b.keep){if(b.fn)b.fn(v,ov);return}ov.remove();if(b.fn)b.fn(v)};
    row.appendChild(el);
  });
  document.body.appendChild(ov);
  const inp=ov.querySelector("#popIn");if(inp)setTimeout(()=>inp.focus(),20);
  return ov;
}
function toast(msg){
  const t=document.createElement("div");t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241a3d;color:#fff;padding:10px 18px;border-radius:14px;z-index:200;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)";
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}
function fmtTime(t){
  try{const d=new Date(t);if(isNaN(d))return String(t||"");
    return d.toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  }catch(e){return String(t||"")}
}

/* ---------------- Suggestions feed (approved, agree/disagree) ---------------- */
async function paintFeed(pane){
  let list=[];
  try{const j=await api("suggestions_list",{studentKey:ME.id});if(j&&j.ok)list=j.suggestions||[]}catch(e){}
  if(!list.length){pane.innerHTML=`<div class="card"><div class="note">No suggestions have been approved yet. Check back soon, or add your own idea! 💡</div></div>`;return}
  pane.innerHTML=`<div class="card">${list.map(suggRow).join("")}</div>`;
  wireSuggRows(pane,list);
}
function attribLine(s){
  if(!s.mine)return"";
  return `<div class="attrib">✅ Recorded as <b>${escapeHtml(s.myName)}</b> · Year ${s.myYear}${escapeHtml(s.myCls)} · ${fmtTime(s.myTime)}</div>`;
}
function suggRow(s){
  const total=Math.max(1,s.agree+s.disagree);
  const aPct=Math.round(s.agree/total*100),dPct=100-aPct;
  return `<div class="sugg" data-id="${s.id}">
    <div class="txt">${escapeHtml(s.text)}</div>
    <div class="meter"><div class="a" style="width:${aPct}%"></div><div class="d" style="width:${dPct}%"></div></div>
    <div class="counts"><span>👍 ${s.agree} agree</span><span>👎 ${s.disagree} disagree</span></div>
    <div class="votebtns">
      <button class="votebtn agree ${s.mine==="agree"?"on":""}" data-r="agree">👍 Agree</button>
      <button class="votebtn disagree ${s.mine==="disagree"?"on":""}" data-r="disagree">👎 Disagree</button>
    </div>
    <div data-attrib>${attribLine(s)}</div>
    <div class="notewrap">
      ${s.mine?`<button class="btn xs ghost" data-note="${s.id}">${s.myComment?"✏️ edit my note":"💬 add a note (optional)"}</button><div class="ta-holder" data-hold="${s.id}"></div>`:`<small style="color:var(--ink-soft)">Pick agree or disagree to add an optional note.</small>`}
    </div>
  </div>`;
}
function wireSuggRows(pane,list){
  const byId={};list.forEach(s=>byId[s.id]=s);
  pane.querySelectorAll(".sugg").forEach(row=>{
    const id=row.dataset.id;
    row.querySelectorAll(".votebtn").forEach(b=>b.onclick=async()=>{
      const resp=b.dataset.r;
      b.closest(".sugg").querySelectorAll(".votebtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      try{
        const j=await api("respond",{studentKey:ME.id,suggId:id,response:resp,comment:byId[id].myComment||""});
        if(!j||!j.ok){toast("Couldn't save — try again");return}
        byId[id].mine=resp;byId[id].myName=ME.name;byId[id].myYear=ME.year;byId[id].myCls=ME.cls;byId[id].myTime=new Date().toISOString();
        toast(resp==="agree"?"👍 Marked as agree":"👎 Marked as disagree");
        loadPane();
      }catch(e){toast("Couldn't save — try again")}
    });
    const noteLink=row.querySelector("[data-note]");
    if(noteLink)noteLink.onclick=()=>{
      const holder=row.querySelector("[data-hold]");
      if(holder.querySelector("textarea")){holder.innerHTML="";return}
      holder.innerHTML=`<textarea class="ta" rows="2" placeholder="Say a bit more (optional)…">${byId[id].myComment||""}</textarea><div class="row" style="margin-top:6px;justify-content:flex-end"><button class="btn sm green" data-save>💾 Save note</button></div>`;
      holder.querySelector("[data-save]").onclick=async()=>{
        const txt=holder.querySelector("textarea").value;
        const mine=byId[id].mine;
        if(!mine){toast("Pick agree or disagree first");return}
        try{
          const j=await api("respond",{studentKey:ME.id,suggId:id,response:mine,comment:txt});
          if(j&&j.ok){byId[id].myComment=txt;toast("Note saved");loadPane()}else toast("Couldn't save — try again")
        }catch(e){toast("Couldn't save — try again")}
      };
    };
  });
}

async function runBulkImport(text){
  const rows=(text||"").split(/\n/).map(l=>l.trim()).filter(Boolean)
    .map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r.length>=3 && r[0] && r[1] && r[2]);
  if(!rows.length){toast("Nothing to import — check the format");return}
  toast("⏳ Importing…");
  await loadRoster();
  const existingYears=new Set(ROSTER.years.map(String));
  const existingClasses=new Set();
  Object.keys(ROSTER.classesByYear).forEach(y=>ROSTER.classesByYear[y].forEach(c=>existingClasses.add(y+"|"+c)));
  const existingStudents=new Set();
  for(const k in ROSTER.studentsByYearCls)ROSTER.studentsByYearCls[k].forEach(s=>existingStudents.add(k+"|"+s.name.trim().toLowerCase()));

  const years=[...new Set(rows.map(r=>r[0]))];
  const classes=[...new Set(rows.map(r=>r[0]+"|"+r[1].toUpperCase()))];
  let nYear=0,nClass=0,nStud=0,nSkip=0;

  for(const y of years){
    if(existingYears.has(String(y)))continue;
    try{const j=await api("admin_add_year",{password:adminPass,year:y});if(j&&j.ok){nYear++;existingYears.add(String(y))}}catch(e){}
  }
  for(const yc of classes){
    if(existingClasses.has(yc))continue;
    const [y,c]=yc.split("|");
    try{const j=await api("admin_add_class",{password:adminPass,year:y,cls:c});if(j&&j.ok){nClass++;existingClasses.add(yc)}}catch(e){}
  }
  for(const r of rows){
    const y=r[0],c=r[1].toUpperCase(),name=r[2];
    const key=y+"|"+c+"|"+name.toLowerCase();
    if(existingStudents.has(key)){nSkip++;continue}
    try{const j=await api("admin_add_student",{password:adminPass,year:y,cls:c,name});if(j&&j.ok){nStud++;existingStudents.add(key)}else nSkip++}catch(e){nSkip++}
  }
  toast(`✅ Added ${nYear} year(s), ${nClass} class(es), ${nStud} student(s)${nSkip?` · ${nSkip} already existed`:""}`);
  paintAdminRoster(document.getElementById("aPane"));
}

            </span>
          </div>
          <div>${studs.length?studs.map(s=>`<span class="studchip">${escapeHtml(s.name)}<button data-remstud="${s.id}" title="Remove student">✕</button></span>`).join(""):`<span style="color:var(--ink-soft);font-size:.85rem">No students yet.</span>`}</div>
        </div>`;
      }).join(""):`<div class="note">No classes in Year ${y} yet — add one above.</div>`}
    </div>`;
  }).join("");

  document.getElementById("bulkImport").onclick=()=>{
    popup({title:"📥 Bulk import roster",text:"One line per student: Year, Class, Name (comma or tab separated). Missing year groups and classes are created automatically. Existing students with the same name in the same class are skipped, so it's safe to click Import more than once.",input:"textarea",inputVal:BULK_IMPORT_DEFAULT,buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Import",cls:"green",fn:(v)=>runBulkImport(v)}
    ]});
  };
  document.getElementById("addYear").onclick=()=>{
    popup({title:"➕ Add a year group",text:"Enter the year number (e.g. 12).",input:"text",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Add",cls:"green",fn:async(v)=>{
        const y=parseInt(v,10);
        if(!y){toast("Enter a valid year number");return}
        try{const j=await api("admin_add_year",{password:adminPass,year:y});if(j&&j.ok){toast("Year added");paintAdminRoster(pane)}else toast("Couldn't add — "+(j&&j.error||"try again"))}
        catch(e){toast("Couldn't add — try again")}
      }}
    ]});
  };
  blocks.querySelectorAll("[data-remyear]").forEach(b=>b.onclick=()=>{
    const y=b.dataset.remyear;
    popup({title:`Remove Year ${y}?`,text:"This deletes ALL its classes and ALL its students. Suggestions already made stay in the history.",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Remove everything",cls:"red",fn:async()=>{try{await api("admin_remove_year",{password:adminPass,year:y})}catch(e){}paintAdminRoster(pane)}}
    ]});
  });
  blocks.querySelectorAll("[data-addclass]").forEach(b=>b.onclick=()=>{
    const y=b.dataset.addclass;
    popup({title:`➕ Add a class to Year ${y}`,text:"Enter the class letter/name (e.g. A).",input:"text",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Add",cls:"green",fn:async(v)=>{
        const c=(v||"").trim();
        if(!c){toast("Enter a class name");return}
        try{const j=await api("admin_add_class",{password:adminPass,year:y,cls:c});if(j&&j.ok){toast("Class added");paintAdminRoster(pane)}else toast("Couldn't add — "+(j&&j.error||"try again"))}
        catch(e){toast("Couldn't add — try again")}
      }}
    ]});
  });
  blocks.querySelectorAll("[data-remclass]").forEach(b=>b.onclick=()=>{
    const [y,c]=b.dataset.remclass.split("|");
    popup({title:`Remove Class ${y}${c}?`,text:"This deletes all students in this class too.",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Remove",cls:"red",fn:async()=>{try{await api("admin_remove_class",{password:adminPass,year:y,cls:c})}catch(e){}paintAdminRoster(pane)}}
    ]});
  });
  blocks.querySelectorAll("[data-addstud]").forEach(b=>b.onclick=()=>{
    const [y,c]=b.dataset.addstud.split("|");
    popup({title:`➕ Add a student to ${y}${c}`,text:"Enter the student's full name.",input:"text",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Add",cls:"green",fn:async(v)=>{
        const name=(v||"").trim();
        if(!name){toast("Enter a name");return}
        try{const j=await api("admin_add_student",{password:adminPass,year:y,cls:c,name});if(j&&j.ok){toast("Student added");paintAdminRoster(pane)}else toast("Couldn't add — "+(j&&j.error||"try again"))}
        catch(e){toast("Couldn't add — try again")}
      }}
    ]});
  });
  blocks.querySelectorAll("[data-remstud]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.remstud;
    popup({title:"Remove this student?",text:"They'll no longer be able to log in on any device.",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Remove",cls:"red",fn:async()=>{try{await api("admin_remove_student",{password:adminPass,id})}catch(e){}paintAdminRoster(pane)}}
    ]});
  });
  document.getElementById("wipeAll").onclick=()=>{
    popup({title:"🧨 Delete ALL history?",text:"This permanently deletes every suggestion, every agree/disagree response and every chat message, for every student. This cannot be undone.",buttons:[
      {label:"Cancel",cls:"ghost"},
      {label:"Yes, understand the risk",cls:"red",fn:()=>{
        popup({title:"Are you REALLY sure?",text:"Type-free final confirmation: this wipes everything right now.",buttons:[
          {label:"Cancel",cls:"ghost"},
          {label:"Delete everything now",cls:"red",fn:async()=>{
            try{const j=await api("admin_wipe_all",{password:adminPass});if(j&&j.ok)toast("✅ All history deleted");else toast("Couldn't delete — try again")}
            catch(e){toast("Couldn't delete — try again")}
          }}
        ]});
      }}
    ]});
  };
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  applyTheme();applyLang();
  app.innerHTML=`<div class="spin">⏳ Loading…</div>`;
  await detectServer();
  if(ME)go(screenHome);else go(screenLogin);
})();
</script>
</body>
</html>
